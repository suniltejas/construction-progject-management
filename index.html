<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172c3c">
  <title>Fieldline — Construction project tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Fieldline home"><span class="brand-mark">F<span></span></span><span>Fieldline<small>Project tracker</small></span></a>
      <div class="side-section"><div class="side-heading">Workspace</div><button class="nav-link active" id="overviewNav" type="button">▦ <span>Overview</span></button></div>
      <div class="side-section"><div class="side-heading row-between">Projects <span id="projectCount"></span></div><nav id="projectNav" aria-label="Projects"></nav><button class="add-project-link" id="addProjectNav" type="button">＋ Add project</button></div>
      <div class="sidebar-bottom"><span class="storage-dot"></span> Saved on this device <button id="exportButton" type="button">Export data</button><label class="import-label">Import data<input id="importInput" type="file" accept="application/json,.json"></label></div>
    </aside>

    <main class="main-content">
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumbCurrent">Overview</strong></div><div class="top-actions"><span id="todayLabel"></span><button class="button primary" id="newProjectButton" type="button">＋ New project</button></div></header>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="projectDialog" aria-labelledby="projectDialogTitle"><form id="projectForm" method="dialog"><div class="dialog-head"><div><p class="eyebrow">Project details</p><h2 id="projectDialogTitle">New project</h2></div><button class="icon-button" type="button" data-close="projectDialog" aria-label="Close">×</button></div><input type="hidden" name="id"><label>Project name<input name="name" maxlength="80" required placeholder="e.g. Riverside Medical Centre"></label><div class="form-grid"><label>Location<input name="location" maxlength="80" placeholder="City or site address"></label><label>Project lead<input name="lead" maxlength="60" placeholder="Name"></label></div><div class="form-grid"><label>Start date<input name="start" type="date" required></label><label>Target finish<input name="end" type="date" required></label></div><label>Stage<select name="stage"><option>Planning</option><option>In progress</option><option>On hold</option><option>Completed</option></select></label><div class="dialog-actions"><button class="button subtle" type="button" data-close="projectDialog">Cancel</button><button class="button primary" type="submit">Save project</button></div></form></dialog>

  <dialog id="taskDialog" aria-labelledby="taskDialogTitle"><form id="taskForm" method="dialog"><div class="dialog-head"><div><p class="eyebrow">Work item</p><h2 id="taskDialogTitle">New task</h2></div><button class="icon-button" type="button" data-close="taskDialog" aria-label="Close">×</button></div><input type="hidden" name="id"><input type="hidden" name="projectId"><label>Task name<input name="name" maxlength="100" required placeholder="What needs to be done?"></label><label>Milestone<select name="milestoneId" required></select></label><div class="form-grid"><label>Assigned to<input name="owner" maxlength="60" placeholder="Name or trade"></label><label>Due date<input name="due" type="date" required></label></div><div class="form-grid"><label>Status<select name="status"><option>Not started</option><option>In progress</option><option>Blocked</option><option>Done</option></select></label><label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Critical</option></select></label></div><div class="dialog-actions"><button class="button danger dialog-delete" id="deleteTaskButton" type="button" hidden>Delete task</button><button class="button subtle" type="button" data-close="taskDialog">Cancel</button><button class="button primary" type="submit">Save task</button></div></form></dialog>

  <dialog id="milestoneDialog" aria-labelledby="milestoneDialogTitle"><form id="milestoneForm" method="dialog"><div class="dialog-head"><div><p class="eyebrow">Schedule</p><h2 id="milestoneDialogTitle">New milestone</h2></div><button class="icon-button" type="button" data-close="milestoneDialog" aria-label="Close">×</button></div><input type="hidden" name="id"><input type="hidden" name="projectId"><label>Milestone name<input name="name" maxlength="100" required placeholder="e.g. Foundation complete"></label><div class="form-grid"><label>Target date<input name="due" type="date" required></label><label>Status<select name="status"><option>Upcoming</option><option>At risk</option><option>Complete</option></select></label></div><div class="dialog-actions"><button class="button danger dialog-delete" id="deleteMilestoneButton" type="button" hidden>Delete milestone</button><button class="button subtle" type="button" data-close="milestoneDialog">Cancel</button><button class="button primary" type="submit">Save milestone</button></div></form></dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
